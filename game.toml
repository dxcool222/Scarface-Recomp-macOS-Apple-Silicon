# runtime/kernel32.cpp compares GetTickCount's return address with these.
# Not identified. Sentinels, so the comparison never matches.
frame_clock_begin = 0x009d4b90
frame_clock_wait = 0x009d4b94
frame_clock_wait_clamp = 0x009d4b98
frame_clock_clamp_deadline = 0x009d4ba0
frame_clock_wait_deadline = 0x009d4ba4
# dx/ddraw.cpp reads these as cursor-surface globals. Not identified.
cursor_surface_ptrs = [0x009d4bb0, 0x009d4bb4]
# host/input_gate.cpp and host/sdl/main.cpp. Not identified. The vtable
# compare does not match a zeroed slot, so the hook does not write.
mouse_vtable = 0x009d4bc0
mouse_device_ptr = 0x009d4bc4
mouse_device_right = 0x009d4bc8

