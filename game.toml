# Scarface: The World Is Yours, PC v1.00.2.
# Identity fields were read from the pinned executable and checked against
# ScarfaceNX. Need for Speed addresses are not used.
#
# Sentinel values live in zero-filled mapped padding after the second .rsrc
# section (0x009d4b20-0x009d4fff). scarface.exe does not reference that
# padding, so kit hooks that have not been mapped for Scarface compile and
# never fire. Replace each one as bring-up identifies the real value.
# Reserved, not yet consumed by the app target: 0x009d4bd0 camera,
# 0x009d4be0 simulation_turn, 0x009d4be4 command_frame, 0x009d4bf0 entity_base.

[game]
id = "scarface"
name = "Scarface: The World Is Yours"
app_name = "ScarfaceRecomp"
bundle_id = "dev.recompkit.scarface"
executable = "scarface.exe"
sha256 = "aee792ee4552e28c533abab7992dd5ad542e8ff12806cbcedab300842d86f6f5"
image_base = 0x00400000
entry_point = 0x009AA7B3
# The guest directory the existing ScarfaceNX filesystem already presents.
# It is not a path recovered from the executable.
guest_root = 'C:\Games\Scarface The World is Yours'
developer_exe = "original/retail/scarface.exe"
# The proven startup oracle returns GetVersion 0x0A280105 and GetVersionExA
# major 5, minor 1, build 2600. The PE optional header itself says OS 4.0.
windows_version = "5.1.2600"

[translate]
listings = "analysis/decompiled/scarface.exe"
globals = "globals.toml"
# Unaligned entries such as 0x009ACB1D stay valid. Listings, initterm and
# entry_points do not use this value. The heuristic dword scan does, unless
# code_pointer_alignment overrides it.
function_alignment = 1
code_pointer_alignment = 16
# Indirect targets ScarfaceNX executed during CRT startup. Evidence:
# docs/startup-cinit-second-table-after-edge.log (same pairs in
# startup-cinit-second-table-after-sparse.log). Targets outside the image
# (0x0FF12xxx) are omitted. Each comment is source EIP -> this target.
# The translator requires a visual-phase counter. None has been audited for
# Scarface. This sentinel is in the padding above, and no guest read names it.
animation_counter = 0x009d4b80
volatile_reads = []
entry_points = [
  # source = indirect JMP at 0x008CD36C
  # slot = 0x00860908
  # target = 0x00702A2C
  # reason = legitimate unlisted/unaligned table target
  # The file stores RVA 0x00302A2C at 0x008C3B6C. The live function adds the
  # image base, writes the scratch dword, and jumps through it. The only other
  # RVA that code reads from that header is 0x005AA7B3, the registered entry.
  # Ghidra lists nothing from 0x00702A2C through the RET at 0x00702C2A.
  0x00702A2C,

  # source = CALL dword ptr [EAX+0x98] at 0x004EA4F4 (EAX = vtable 0x0075B884)
  # slot = 0x0075B91C, the only image dword naming this address
  # target = 0x005F6240
  # reason = SEH prologue (MOV EAX,FS:[0]; PUSH -1; PUSH 0x007175D0) after the
  # INT3 padding that follows fn_005f6220's RET 4. The data-pointer guess was
  # withdrawn ("wanted 005f6d2f", the JE at 0x005F6704 into its own body) while
  # interior fragments fn_005f690b..fn_005f6b69 survived. Live run after the
  # intro logged "call to unknown target 005f6240" there, then SIGSEGV.
  0x005F6240,
  # The same gap, swept over .data (the image has no base relocations, so
  # vtable slots carry no relocation evidence). Each target is 16-aligned, is
  # named by a dword in a run of code pointers, and follows INT3 padding or a
  # RET, or opens with the MSVC SEH prologue; none had a function, only
  # interior fragments. Census: build/vtable-gap-census.txt. The live run after
  # the intro called 0x0056D5D0 and 0x0056D3C0 through [EDX+0x20] (return
  # 0x004F02FB) and got the unknown-target fallback.
  0x004A6880, # slot 0x0073B1D4
  0x004A6AF0, # slot 0x0073B1D8
  0x00554390, # slot 0x00746214
  0x0056D3C0, # slot 0x00747524
  0x0056D5D0, # slot 0x0074759C

